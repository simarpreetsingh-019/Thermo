# Signs a provenance statement for each release's Thermo.zip, so anyone can check that the file
# they downloaded is the one published by this repository:
#   gh attestation verify Thermo.zip --repo simarpreetsingh-019/Thermo
name: Attest release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag to attest (e.g. v1.5.1)", required: true }

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern Thermo.zip
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: Thermo.zip
