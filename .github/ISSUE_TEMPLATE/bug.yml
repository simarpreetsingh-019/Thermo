name: 🐞 Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A screenshot of the notch/panel helps a lot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: environment
    attributes:
      label: Version & Mac
      placeholder: Thermo 1.4.0 · macOS 15 · MacBookPro18,3
